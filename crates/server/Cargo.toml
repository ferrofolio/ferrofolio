# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.8", features = ["derive", "env"] }
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
nix = { version = "0.32.0", default-features = false, features = ["fs", "signal"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time", "sync", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
futures-core = "0.3.34"
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "ferrofolio"
path = "src/main.rs"
