name: Upstream Review

# Lists the commits that upstream Finanze added since the last run, as a comment on
# one open issue labelled `upstream` (roadmap, section 7.7). Each commit is a task to
# triage as relevant, to take or to ignore. The comment records the upstream commit it
# ends at, so the next run starts there. Nothing is merged or changed automatically.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: Report new upstream commits
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Comment the new upstream commits on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM: finanze/finanze
          UPSTREAM_BRANCH: develop
          LABEL: upstream
          TITLE: Review new upstream commits
          # The first run, or a run whose recorded commit upstream no longer has,
          # looks back this many days.
          LOOKBACK_DAYS: "7"
        run: |
          set -euo pipefail
          marker='upstream-head'

          gh label create "$LABEL" --repo "$REPO" --color 5319e7 \
            --description "Changes in upstream Finanze" --force

          issue="$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --json number --jq 'sort_by(.number) | .[0].number // empty')"
          if [[ -z $issue ]]; then
            body="$RUNNER_TEMP/issue.md"
            {
              echo "Each week the \`Upstream Review\` workflow comments here with the commits that"
              echo "[${UPSTREAM}](https://github.com/${UPSTREAM}/commits/${UPSTREAM_BRANCH}) added since its last comment"
              echo "(roadmap, section 7.7). Triage every commit as **relevant**, **to take** or **ignore**,"
              echo "tick it, and take the changes worth having in their own pull requests."
              echo
              echo "Keep this issue open: the workflow continues from the commit its last comment names."
            } > "$body"
            url="$(gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --body-file "$body")"
            issue="${url##*/}"
          fi

          # A failed request stops the run: the checkpoint only advances after a report
          # that covers every commit since the previous one has been posted.
          head="$(gh api "repos/${UPSTREAM}/commits/${UPSTREAM_BRANCH}" --jq .sha)"
          bodies="$(gh api --paginate "repos/${REPO}/issues/${issue}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body')"
          last="$(grep -oE "<!-- ${marker}: [0-9a-f]{40} -->" <<< "$bodies" | tail -n 1 \
            | grep -oE '[0-9a-f]{40}' || true)"

          if [[ $last == "$head" ]]; then
            echo "No new upstream commits since ${head:0:12}."
            exit 0
          fi

          # Commit messages and author names come from upstream. They are escaped so
          # that they cannot mention users, link issues of this repository, or hide
          # text in HTML, and they are never printed to the log.
          # `&` and `#` go first, as the entities that replace the other characters
          # contain them.
          escape='gsub("&"; "&amp;") | gsub("#"; "&#35;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")
            | gsub("@"; "&#64;") | gsub("`"; "&#96;")
            | gsub("\\["; "&#91;") | gsub("]"; "&#93;") | gsub("\\|"; "&#124;")'
          # The backticks and $ENV belong to the jq program and Markdown, not to the shell.
          # shellcheck disable=SC2016
          line='"- [ ] [`" + .sha[0:7] + "`](" + .html_url + ") "
            + ((.commit.message | split("\n")[0] | .[0:120]) | '"$escape"'
                | gsub("&#35;(?<n>[0-9]+)"; "[&#35;\(.n)](https://github.com/\($ENV.UPSTREAM)/issues/\(.n))"))
            + " (" + ((.commit.author.name // "unknown") | '"$escape"') + ", "
            + (.commit.author.date // "" | .[0:10]) + ")"'

          # The comparison is `ahead` when the recorded commit is an ancestor of the
          # head. A recorded commit that upstream no longer has (404) or that is not an
          # ancestor (after a force-push) falls back to the lookback window; any other
          # error stops the run.
          status=none
          if [[ -n $last ]]; then
            err="$RUNNER_TEMP/compare.err"
            if status="$(gh api "repos/${UPSTREAM}/compare/${last}...${head}?per_page=1" \
              --jq .status 2> "$err")"; then
              :
            elif grep -q 'HTTP 404' "$err"; then
              status=missing
            else
              cat "$err" >&2
              exit 1
            fi
          fi

          commits="$RUNNER_TEMP/commits.md"
          note=""
          if [[ $status == ahead ]]; then
            gh api --paginate "repos/${UPSTREAM}/compare/${last}...${head}?per_page=100" \
              --jq ".commits[] | $line" > "$commits"
            range="[\`${last:0:7}...${head:0:7}\`](https://github.com/${UPSTREAM}/compare/${last}...${head})"
          else
            if [[ -n $last ]]; then
              note="The commit \`${last:0:7}\` of the previous report is no longer an ancestor of upstream (${status}); this lists the last ${LOOKBACK_DAYS} days only."
            fi
            since="$(date -u -d "${LOOKBACK_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
            gh api --paginate "repos/${UPSTREAM}/commits?sha=${head}&since=${since}&per_page=100" \
              --jq ".[] | $line" | tac > "$commits"
            range="the last ${LOOKBACK_DAYS} days up to [\`${head:0:7}\`](https://github.com/${UPSTREAM}/commit/${head})"
          fi

          count="$(wc -l < "$commits")"
          if (( count == 0 )) && [[ -n $last ]]; then
            echo "No new upstream commits."
            exit 0
          fi

          # A comment holds at most 65,536 characters, so a long list is split into
          # parts. Only the last part records the checkpoint: if a post fails, the next
          # run reports the same range again.
          parts="$RUNNER_TEMP/parts"
          mkdir -p "$parts"
          part=1
          size=0
          : > "$parts/1"
          while IFS= read -r task; do
            if (( size + ${#task} + 1 > 60000 )); then
              part=$((part + 1))
              size=0
              : > "$parts/$part"
            fi
            printf '%s\n' "$task" >> "$parts/$part"
            size=$((size + ${#task} + 1))
          done < "$commits"

          for ((i = 1; i <= part; i++)); do
            comment="$RUNNER_TEMP/comment-$i.md"
            {
              if (( part > 1 )); then
                echo "### ${count} new upstream commits (part ${i} of ${part})"
              else
                echo "### ${count} new upstream commits"
              fi
              echo
              echo "${UPSTREAM}@${UPSTREAM_BRANCH}, ${range}. Triage each as relevant, to take or ignore."
              if [[ -n $note ]]; then
                echo
                echo "$note"
              fi
              echo
              if (( count == 0 )); then
                echo "No commits in this range."
              else
                cat "$parts/$i"
              fi
              if (( i == part )); then
                echo
                echo "<!-- ${marker}: ${head} -->"
              fi
            } > "$comment"
            gh issue comment "$issue" --repo "$REPO" --body-file "$comment" > /dev/null
          done
          echo "Reported ${count} upstream commits up to ${head:0:12} on issue #${issue} in ${part} comment(s)."
