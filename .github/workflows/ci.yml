name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decides which jobs run. The test jobs are required checks, so they are skipped
  # through a job condition rather than a paths filter on the trigger: a skipped job
  # counts as passed, a workflow that never starts leaves the check pending.
  # Because a skipped job counts as passed, every job also runs when this job does
  # not succeed; otherwise a failed detection would let a pull request merge untested.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Directories the filters below rely on. If one is moved or renamed the
          # filters would stop matching it and its jobs would be skipped silently,
          # so the job fails until this list and the filters are updated.
          for dir in finanze tests crates frontend/app e2e/standard; do
            if [[ ! -d "$dir" ]]; then
              echo "::error::$dir no longer exists; update the path filters in ci.yml."
              exit 1
            fi
          done

          # --no-renames lists a renamed file under its old and its new path, so a
          # file moved out of a filtered directory still runs that directory's jobs.
          # -z prints raw NUL-separated paths; without it Git quotes paths with
          # non-ASCII or special characters and the filters would not match them.
          list="$RUNNER_TEMP/changed-files"
          if git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$list"; then
            mapfile -d '' -t files < "$list"
          else
            echo "Could not list changed files; running every job."
            files=(".github/workflows/ci.yml")
          fi

          # File names come from the pull request. A line starting with "::" would be
          # run as a workflow command (::add-mask:: could hide this job's outputs and
          # skip the required jobs), so command processing is off while they are logged.
          stop_token="$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop_token"
          printf '%s\n' "${files[@]}"
          echo "::$stop_token::"

          # A change to this workflow runs every job.
          workflow='^\.github/workflows/ci\.yml$'
          # Root files that configure Python dependencies, pytest or ruff.
          python_config='^(pyproject\.toml|requirements[^/]*\.txt|pytest\.ini|tox\.ini|setup\.cfg|conftest\.py|\.?ruff\.toml)$'
          # The Rust workspace and its configuration.
          rust_config='^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|clippy\.toml$|deny\.toml$)'
          # Files generated from Python, which the backend job checks are current, and
          # the list of ported routes, which a Python test checks against the backend.
          parity_fixtures='^(crates/server/tests/fixtures/|crates/core-domain/tests/fixtures/|crates/core-domain/src/unicode_digits\.rs$|crates/core-domain/src/python_printable\.rs$|crates/server/ported_routes\.json$|crates/infra-db/tests/fixtures/)'

          match() {
            local file
            for file in "${files[@]}"; do
              if [[ $file =~ $1 || $file =~ $workflow ]]; then
                echo true
                return
              fi
            done
            echo false
          }

          {
            echo "backend=$(match "^(finanze|tests)/|$python_config|$parity_fixtures")"
            echo "python=$(match "\.(py|pyi|ipynb)$|$python_config")"
            echo "rust=$(match "$rust_config")"
            echo "docker=$(match "^(Dockerfile|\.dockerignore|requirements(-selenium)?\.txt|finanze/)|$rust_config")"
            echo "frontend=$(match '^frontend/app/')"
            echo "e2e=$(match "^(finanze|frontend/app|e2e/standard)/|$python_config")"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest

      - name: Check the Rust parity fixtures against the Python backend
        run: python tests/parity/generate_calculation_fixtures.py --check crates/server/tests/fixtures/calculations_parity.json

      - name: Check the Rust Unicode tables against Python
        run: python tests/parity/generate_unicode_tables.py --check

      - name: Check the Rust decimal fixtures against Python
        run: python tests/parity/generate_decimal_fixtures.py --check crates/core-domain/tests/fixtures/decimal_parity.json

      - name: Check that Python opens the Rust database fixture with every migration
        run: python tests/parity/generate_db_fixture.py --check crates/infra-db/tests/fixtures

      - name: Check the fixtures of the routes that read the database against the Python backend
        run: python tests/parity/generate_db_route_fixtures.py --check crates/server/tests/fixtures/db_routes

  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Check licences, advisories and sources
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2

  # The server image starts the Rust server, which starts the Python backend; both
  # have to work inside the image, not only in their own jobs.
  docker:
    name: Docker Image
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the server image
        run: docker build --build-arg SELENIUM_SUPPORT=false --tag ferrofolio-server:ci .

      - name: Call a forwarded and a ported route in the running image
        run: |
          docker run --detach --name ferrofolio-ci --publish 127.0.0.1:7592:7592 ferrofolio-server:ci \
            --port 7592 --data-dir /tmp/storage --log-dir /tmp/storage/logs
          # The server refuses connections until the Python backend is ready.
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 10 --output /dev/null http://127.0.0.1:7592/api/v1/status; then
              break
            fi
            sleep 2
          done
          # Forwarded to Python. A new data directory is locked.
          status="$(curl --silent --show-error --fail --max-time 10 http://127.0.0.1:7592/api/v1/status)"
          echo "$status"
          echo "$status" | grep --quiet '"status":"LOCKED"'
          # While the data is locked, Python's session guard lets the request through
          # (and the route rejects the empty body with 400); only Rust answers 401.
          code="$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:7592/api/v1/calculation/loan)"
          echo "ported route: $code"
          test "$code" = 401

      - name: Sign up, log in and out through the Rust sessions
        run: |
          base=http://127.0.0.1:7592/api/v1
          # Prints the status code of a request; the remaining arguments go to curl.
          code() {
            curl --silent --max-time 60 --output /dev/null --write-out '%{http_code}' "$@"
          }
          status_of() {
            curl --silent --show-error --fail --max-time 10 "$@" "$base/status" | jq --raw-output .status
          }
          # The signup unlocks the data; Rust answers with a token of its own.
          token="$(curl --silent --show-error --fail --max-time 120 --request POST \
            --header 'Content-Type: application/json' \
            --data '{"username":"ci-user","password":"ci-password-1","remember":true}' \
            "$base/signup" | jq --raw-output .token)"
          test "${#token}" = 43
          auth=(--header "Authorization: Bearer $token")
          test "$(status_of "${auth[@]}")" = UNLOCKED
          test "$(status_of)" = LOCKED
          # A forwarded route: Python's session guard, with the backend token in place
          # of the client's.
          test "$(code "$base/settings")" = 401
          test "$(code "${auth[@]}" "$base/settings")" = 200
          # A ported route: Rust's session check; the empty body is then refused.
          loan=(--request POST --header 'Content-Type: application/json' --data '{}' "$base/calculation/loan")
          test "$(code "${loan[@]}")" = 401
          test "$(code "${auth[@]}" "${loan[@]}")" = 400
          # The logout ends the session in both processes.
          test "$(code --request POST "$base/logout")" = 401
          test "$(code --request POST "${auth[@]}" "$base/logout")" = 204
          test "$(status_of "${auth[@]}")" = LOCKED
          test "$(code "${auth[@]}" "${loan[@]}")" = 401
          # A login starts a new session.
          token="$(curl --silent --show-error --fail --max-time 120 --request POST \
            --header 'Content-Type: application/json' \
            --data '{"username":"ci-user","password":"ci-password-1"}' \
            "$base/login" | jq --raw-output .token)"
          auth=(--header "Authorization: Bearer $token")
          test "$(status_of "${auth[@]}")" = UNLOCKED
          test "$(code "${auth[@]}" "$base/settings")" = 200
          # Each accepted login also opened the user's database in Rust.
          test "$(docker logs ferrofolio-ci 2>&1 | grep --count 'unlocked the database read-only')" = 2

      - name: Unlock the data in Rust without API sessions
        run: |
          # Prints the status code of a request; the remaining arguments go to curl.
          code() {
            curl --silent --max-time 120 --output /dev/null --write-out '%{http_code}' "$@"
          }
          # Starts the image without API sessions on the given port, with a data
          # directory that outlives the container, and waits until it answers.
          start() {
            local name="$1" port="$2"
            shift 2
            docker run --detach --name "$name" --publish "127.0.0.1:$port:7592" \
              --env FINANZE_API_SESSION=false --volume ferrofolio-ci-data:/data "$@" \
              ferrofolio-server:ci --port 7592 --data-dir /data --log-dir /data/logs
            for attempt in $(seq 1 90); do
              if curl --silent --fail --max-time 10 --output /dev/null "http://127.0.0.1:$port/api/v1/status"; then
                return
              fi
              sleep 2
            done
          }
          unlocks() {
            docker logs "$1" 2>&1 | grep --count 'unlocked the database read-only' || true
          }
          json=(--request POST --header 'Content-Type: application/json')
          credentials='{"username":"ci-user","password":"ci-password-1"}'

          # A local run may have left the volume of an aborted run behind.
          docker volume rm --force ferrofolio-ci-data || true
          # Rust opens the user's database at every login Python accepts.
          start ferrofolio-ci-open 7593
          base=http://127.0.0.1:7593/api/v1
          loan=("${json[@]}" --data '{}' "$base/calculation/loan")
          test "$(code "${loan[@]}")" = 401
          test "$(code "${json[@]}" --data "$credentials" "$base/signup")" = 204
          test "$(code "${loan[@]}")" = 400
          test "$(code --request POST "$base/logout")" = 204
          test "$(code "${loan[@]}")" = 401
          test "$(code "${json[@]}" --data "$credentials" "$base/login")" = 204
          test "$(unlocks ferrofolio-ci-open)" = 2
          docker stop ferrofolio-ci-open

          # Python's automatic login at startup unlocks it for Rust too; a login
          # with the right password is then refused with 409 by Python.
          start ferrofolio-ci-auto 7594 --env USERNAME=ci-user --env PASSWORD=ci-password-1
          base=http://127.0.0.1:7594/api/v1
          test "$(code "${json[@]}" --data '{}' "$base/calculation/loan")" = 400
          test "$(unlocks ferrofolio-ci-auto)" = 1
          test "$(code "${json[@]}" --data "$credentials" "$base/login")" = 409

      - name: Show the container logs
        if: ${{ always() }}
        run: |
          for name in ferrofolio-ci ferrofolio-ci-open ferrofolio-ci-auto; do
            docker logs "$name" || true
          done

      # A GitHub runner is discarded after the job; a local run with
      # scripts/ci-local.sh shares the container engine with the next run.
      - name: Remove the containers
        if: ${{ always() }}
        run: |
          docker rm --force ferrofolio-ci ferrofolio-ci-open ferrofolio-ci-auto || true
          docker volume rm --force ferrofolio-ci-data || true

  format-check:
    name: Format Check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install Python linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: Check Python formatting with ruff
        run: |
          echo "Checking Python code formatting..."
          ruff check .
          ruff format --check .

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/app/.nvmrc

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Check frontend linting
        working-directory: frontend/app
        run: pnpm run lint

      - name: Check frontend formatting with prettier
        working-directory: frontend/app
        run: pnpm exec prettier --check .

  e2e:
    name: E2E Tests
    needs: changes
    # Temporarily disabled while the repository is being rewritten. A skipped job
    # counts as passed, so the required check does not block pull requests.
    # To re-enable, restore the condition below.
    # if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/app/.nvmrc

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: e2e/standard
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/standard/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: e2e/standard
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        working-directory: e2e/standard
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        working-directory: e2e/standard
        run: pnpm test

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/standard/test-results/
          retention-days: 7

  frontend-test:
    name: Frontend Tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/app/.nvmrc

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend/app
        run: pnpm test

