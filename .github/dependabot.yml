# Dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem and week; major updates arrive separately so they can be reviewed alone.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /frontend/app
      - /e2e/standard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      javascript:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
