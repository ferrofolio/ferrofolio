# Dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem and week; major updates arrive separately so they can be reviewed alone.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Major upgrades are deliberate migration PRs that need a manual review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /frontend/app
      - /e2e/standard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Major upgrades are deliberate migration PRs that need a manual review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      javascript:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    # The runtime versions in the images have to match the versions CI tests
    # (python-version in ci.yml, frontend/app/.nvmrc). CI does not build the
    # images, so a runtime upgrade is done by hand in all places at once.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
