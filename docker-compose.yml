  ferrofolio-front:
    restart: unless-stopped
    build: frontend                                   # Built from frontend/Dockerfile in this repository
    image: ghcr.io/ferrofolio/ferrofolio-frontend:latest
    ports:
      - "8080:80"
    environment:
      - FINANZE_BASE_URL=http://localhost:7592        # Url where the backend is reachable from the frontend