services:
  ferrofolio-server:
    restart: unless-stopped
    # Ferrofolio does not publish images yet, so the image is built from this repository.
    build:
      context: .
      args:
        SELENIUM_SUPPORT: "false"                      # Set to "true" for Selenium support (Mintos)
    image: ghcr.io/ferrofolio/ferrofolio:latest
    ports:
      - '7592:7592'
    # environment:
      # USERNAME: myusername                          # Optional, provided via API when logging in, or use .env, this will automatically log in
      # PASSWORD: myVerySecretPasswordToEncryptDB     # Optional, provided via API when logging in, or use .env, this will automatically log in
      # FINANZE_API_SESSION: "false"                 # Not recommended, disables per-client API sessions, any client reaching the server can use the API once unlocked
      # FINANZE_API_SESSION_REMEMBER_DAYS: "30"      # Optional, days until "Remember me" sessions expire, they never expire by default
      # FINANZE_PUBLIC_URL: https://finance.example.com  # Optional, address of this server as seen from your browser, used for the bank consent redirect
      # Selenium related envs, only if the image is built with SELENIUM_SUPPORT "true"
      # WEBDRIVER_ADDRESS: http://selenium:4444
      # Local AI models, only if you enable the ferrofolio-llama service below
      # FINANZE_LLAMA_SERVER_URL: http://ferrofolio-llama:8080
      # FINANZE_LLAMA_SERVER_API_KEY: ${FINANZE_LLAMA_API_KEY}
    # env_file:
    #   - .env                                         # Load environment variables from .env file in case you want to provide USERNAME and PASSWORD this way
    volumes:
      - ./.storage/:/.storage
      - /etc/timezone:/etc/timezone:ro                 # Use host's timezone
      - /etc/localtime:/etc/localtime:ro               # Use host's localtime
    command: |
      --port 7592
      --data-dir /.storage
      --log-dir /.storage/logs
      --log-level DEBUG

#  Optional, only if the server image is built with SELENIUM_SUPPORT "true" (for Mintos)
